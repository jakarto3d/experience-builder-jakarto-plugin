name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run widget-check

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Package widget
        run: |
          cd widgets
          zip -r "../Jakartowns-${GITHUB_REF_NAME}.zip" Jakartowns

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: Jakartowns-${{ github.ref_name }}.zip
          generate_release_notes: true
